<ion-list>
  <ion-reorder-group (ionItemReorder)="reorderItems($event)" disabled="false">
    <ion-item-sliding #slidingItem *ngFor="let item of data">
      <ion-item>
        <ion-reorder slot="start"></ion-reorder>
        <ion-label>{{ getItemLabel(item) }}</ion-label>

        <ion-button
          class="inverse"
          size="small"
          (click)="showItemOptions(slidingItem)"
        >
          <ion-icon name="ellipsis-vertical"></ion-icon>
        </ion-button>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="primary" (click)="openFormModal(item)">
          <ion-icon slot="icon-only" name="create-outline"></ion-icon>
        </ion-item-option>
        <ion-item-option color="secondary" (click)="duplicateItem(item)">
          <ion-icon slot="icon-only" name="copy-outline"></ion-icon>
        </ion-item-option>
        <ion-item-option color="danger" (click)="deleteItem(item)">
          <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-reorder-group>
</ion-list>

<ion-button expand="full" (click)="openFormModal()">Add Item</ion-button>
